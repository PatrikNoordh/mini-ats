name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, type check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  functions:
    name: Edge Functions (deno check and test)
    runs-on: ubuntu-latest
    env:
      # The functions import with npm: and jsr: specifiers; the app's package.json is not theirs.
      DENO_NO_PACKAGE_JSON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-env supabase/functions

  rls:
    name: RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ats_rls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ats_rls_test
    steps:
      - uses: actions/checkout@v4
      - name: Supabase stand-in
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/local_stub.sql
      - name: Migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: RLS checks
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/rls_test.sql
      - name: Concurrent card moves
        run: bash supabase/tests/move_application_concurrency.sh
      - name: Concurrent removals of the last admins
        run: bash supabase/tests/last_admin_concurrency.sh
      - name: Concurrent writes to pipeline stages
        run: bash supabase/tests/pipeline_stages_concurrency.sh

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: npm ci
      - name: Local Supabase stack (applies the migrations)
        # Only what the app uses: database, Auth, API, Storage and the Edge Functions.
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - name: Point the tests at the local stack
        # The CLI's fixed local keys, not secrets. scripts/local-stack.ts reads these variables.
        run: |
          supabase status -o json | jq -r '
            "E2E_SUPABASE_URL=\(.API_URL)",
            "E2E_ANON_KEY=\(.ANON_KEY)",
            "E2E_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"' >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - name: Seed, build and run Playwright
        # e2e/global-setup.ts seeds the stack; the web server in playwright.config.ts builds the app
        # against it.
        run: npm run test:e2e
      - name: Upload the traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            test-results/
            playwright-report/
          retention-days: 7
