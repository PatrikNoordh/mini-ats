# The local Supabase stack for the end-to-end tests (ATS-36): `npx supabase start` runs it in
# Docker and applies supabase/migrations/ to a fresh database. It never touches the linked
# project. Only the settings the app depends on are listed; everything else is the CLI default.
project_id = "mini-ats"

[api]
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# The same major version as the project.
major_version = 17

[db.seed]
# The test data is written by scripts/seed-e2e.ts through the Auth admin API, so the profile
# trigger runs as it does for a real account. No SQL seed.
enabled = false

[studio]
port = 54323

[auth]
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:4173"]
# Public sign-up is disabled, as in the project (security rule 3). Accounts are made by an admin.
enable_signup = false

[auth.email]
# The email provider itself: false would turn off password sign-in too. Sign-up stays closed
# through [auth] enable_signup above. CLI v3 names this switch `enabled`; `enable_signup` here is
# its deprecated name (ATS-59).
enabled = true
enable_confirmations = false
# Secure email change: both the old and the new address must confirm a change (ATS-49). The
# project has the same setting on, under Authentication → Sign In / Providers → Email.
double_confirm_changes = true

# Every email Auth can send has its own template, in Swedish and English, so no Supabase default
# ever goes out (ATS-49). The files in supabase/templates/ are the source for the project too:
# docs/auth-email.md says how they and these subjects are copied into its dashboard. Locally the
# emails land in Mailpit (MAILPIT_URL in `npx supabase status`), never in a real inbox.
[auth.email.template.invite]
subject = "Du är inbjuden till Mini-ATS · You are invited to Mini-ATS"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Återställ ditt lösenord · Reset your password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Logga in på Mini-ATS · Sign in to Mini-ATS"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Bekräfta din e-postadress · Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Bekräfta byte av e-postadress · Confirm your email change"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Din bekräftelsekod · Your confirmation code"
content_path = "./supabase/templates/reauthentication.html"

[auth.rate_limit]
# Emails Auth may send per hour on the local stack. The CLI default, 2, would stop the
# end-to-end tests after their first run; the project's own limit is set in its dashboard.
email_sent = 100

[storage]
# The cvs bucket and its limits come from the migrations; this is only Storage's upper bound.
file_size_limit = "50MiB"

[edge_runtime]
# Serves supabase/functions/ next to the API, so admin-create-user and the others run locally.
enabled = true
deno_version = 2
